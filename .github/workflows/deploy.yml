# Đóng gói (scripts/build.py) rồi đăng lên GitHub Pages:
#   - mỗi lần push vào main
#   - mỗi sáng 07:05 giờ VN, để bài hẹn ngày tự lên
#   - bấm tay: Actions → Deploy blog → Run workflow
name: Deploy blog

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/build.py
        env:
          TZ: Asia/Ho_Chi_Minh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
